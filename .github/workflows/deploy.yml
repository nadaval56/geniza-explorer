name: Build & Deploy Geniza Explorer

on:
  push:
    branches: [main]
  workflow_dispatch:       # Allow manual trigger
  schedule:
    - cron: '0 3 1 * *'   # Monthly refresh of PGP data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Renamed from "pages". Runs #2879 and #2880 both sat in `queued` with zero
  # jobs ever created and could not be cancelled (the cancel API returned 500),
  # which is the signature of a run blocked on a concurrency group that never
  # released. A fresh group name sidesteps the wedged one.
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Scheduled runs execute on the repository's DEFAULT branch, whatever
          # that happens to be. While the default branch was still an old
          # feature branch, the monthly cron rebuilt that months-old snapshot
          # and published it over the live site (2026-08-01). Pinning the ref
          # keeps every trigger — push, schedule, manual — building main.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build site
        run: python build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
